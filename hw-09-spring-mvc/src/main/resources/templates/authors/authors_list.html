<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Authors</title>
</head>
<body>
<h3>Authors:</h3>

<table class="authors">
    <thead>
    <tr>
        <th>Full Name</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="author : ${authors}" th:object="${author}">
        <td th:text="*{fullName}">Author name</td>
    </tr>
    </tbody>
</table>
<div class="padding-top">
    <a href="../books/books_list.html" th:href="@{/}">
        <button type="button">To books</button>
    </a>
</div>
</body>
</html>
